<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin | Neo Flux</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./admin.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <header>
        <img src="./logo.png" alt="Logo Neo Flux" class="logo">
    </header>

    <main>
        <!-- TELA DE LOGIN DO ADMIN -->
        <section id="tela-admin-login" class="tela ativa" style="max-width: 400px; margin: 0 auto;">
            <h2 style="text-align: center;">Acesso Restrito</h2>
            <form id="form-admin-login">
                <label for="admin-email">E-mail Admin:</label>
                <input type="email" id="admin-email" required>

                <label for="admin-senha">Senha:</label>
                <input type="password" id="admin-senha" required>

                <button type="submit" class="botao-principal">Entrar no Painel</button>
            </form>
        </section>

        <!-- TELA DO PAINEL -->
        <section id="tela-admin-painel" class="tela">
            <div class="admin-header">
                <h1 class="admin-titulo">
                    <i data-lucide="shield-check"></i> Painel do Administrador
                </h1>
                <button id="btn-admin-sair" class="botao-principal botao-admin-sair">Sair</button>
            </div>

            <!-- TABELA DE CLIENTES -->
            <div class="caixa-termos admin-caixa-clientes">
                <h3 class="admin-clientes-titulo">
                    <i data-lucide="users"></i> Gerenciar Clientes
                </h3>
                
                <div class="admin-filtros">
                    <input type="text" id="admin-busca-cliente" placeholder="🔍 Buscar por nome ou e-mail..." class="admin-input-busca">
                </div>

                <div class="admin-tabela-wrapper">
                    <table class="tabela-admin tabela-clientes">
                        <thead>
                            <tr>
                                <th>Cliente</th>
                                <th>Plano</th>
                                <th>Status</th>
                                <th class="texto-centro">Ação</th>
                            </tr>
                        </thead>
                        <tbody id="lista-clientes"></tbody>
                    </table>
                </div>
            </div>

            <!-- TABELA DE UPGRADES -->
            <div class="caixa-termos admin-caixa-clientes" style="margin-top: 25px;">
                <h3 class="admin-clientes-titulo">
                    <i data-lucide="trending-up"></i> Solicitações de Upgrade
                </h3>
                <div class="admin-tabela-wrapper">
                    <table class="tabela-admin tabela-vencimentos">
                        <thead>
                            <tr>
                                <th>Cliente</th>
                                <th>Plano Solicitado</th>
                                <th class="texto-centro">Ação</th>
                            </tr>
                        </thead>
                        <tbody id="lista-upgrades"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script>lucide.createIcons();</script>
    <script type="module" src="./admin.js"></script>
</body>
</html>
