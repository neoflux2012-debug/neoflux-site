        <!-- TELA 10: VISUALIZAÇÃO DO SUBSITE (PAINEL DO CLIENTE) -->
        <section id="tela-subsite" class="tela">
            <!-- Cabeçalho do Subsite -->
            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 20px;">
                <div>
                    <p style="text-align: left; margin: 0; font-size: 0.9rem; color: var(--texto-secundario);">Painel do Subsite</p>
                    <h1 id="nome-do-subsite" style="color: var(--cor-azul); font-size: 2.5rem; margin: 0;">...</h1>
                </div>
                <button id="btn-voltar-cliente" class="botao-principal" style="width: auto; background: #333;">Voltar</button>
            </div>

            <!-- Grid de Ferramentas (Vai ocupar o espaço todo) -->
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; width: 100%;">
                
                <!-- FERRAMENTA 1: CONTRATOS -->
                <div id="card-gerador-contrato" style="background: #121212; border: 1px solid #333; border-radius: 12px; padding: 25px; text-align: left;">
                    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px;">
                        <i data-lucide="file-text" style="color: var(--cor-azul); width: 28px; height: 28px;"></i>
                        <h3 style="color: white; margin: 0; font-size: 1.3rem;">Contratos</h3>
                    </div>
                    <p style="font-size: 0.9rem; color: #888; margin-bottom: 20px; height: 40px;">Gere contratos de aluguel automaticamente.</p>
                    <button id="btn-gerador-contrato" class="botao-principal" style="width: 100%;">Acessar</button>
                </div>

                <!-- FERRAMENTA 2: REUNIÕES -->
                <div id="card-reunioes" style="background: #121212; border: 1px solid #333; border-radius: 12px; padding: 25px; text-align: left;">
                    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px;">
                        <i data-lucide="calendar" style="color: #27ae60; width: 28px; height: 28px;"></i>
                        <h3 style="color: white; margin: 0; font-size: 1.3rem;">Reuniões</h3>
                    </div>
                    <p id="txt-reunioes" style="font-size: 0.9rem; color: #888; margin-bottom: 20px; height: 40px;">Agende reuniões com clientes.</p>
                    <button id="btn-reunioes" class="botao-principal" style="width: 100%;">Acessar</button>
                </div>

                <!-- FERRAMENTA 3: HISTÓRICO DE PONTOS -->
                <div id="card-pontos" style="background: #121212; border: 1px solid #333; border-radius: 12px; padding: 25px; text-align: left;">
                    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px;">
                        <i data-lucide="clock" style="color: #9b59b6; width: 28px; height: 28px;"></i>
                        <h3 style="color: white; margin: 0; font-size: 1.3rem;">Histórico</h3>
                    </div>
                    <p id="txt-pontos" style="font-size: 0.9rem; color: #888; margin-bottom: 20px; height: 40px;">Veja o histórico de pontos.</p>
                    <button id="btn-pontos" class="botao-principal" style="width: 100%;">Acessar</button>
                </div>

                <!-- FERRAMENTA 4: ARMAZENAMENTO -->
                <div id="card-armazenamento" style="background: #121212; border: 1px solid #333; border-radius: 12px; padding: 25px; text-align: left;">
                    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px;">
                        <i data-lucide="database" style="color: #f39c12; width: 28px; height: 28px;"></i>
                        <h3 style="color: white; margin: 0; font-size: 1.3rem;">Armazenamento</h3>
                    </div>
                    <p id="txt-armazenamento" style="font-size: 0.9rem; color: #888; margin-bottom: 20px; height: 40px;">Seus dados estão seguros.</p>
                    <button class="botao-principal" style="width: 100%; background: #333; cursor: default;">Ativo</button>
                </div>

            </div>
        </section>
